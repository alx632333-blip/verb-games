<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Verb Games — неправильні дієслова</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
<style>
:root{--pink:#ed1b76;--teal:#0f9d8f;--bg:#0c0c12;--pn:#1b1b27;--ink:#f3f3f8;--mut:#9a9ab0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#41113a,#0c0c12 60%) fixed;background-color:#0c0c12;color:var(--ink);font-family:'Rubik','Segoe UI',system-ui,sans-serif;font-weight:500}
#app{max-width:760px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:clamp(34px,9vw,60px);text-align:center;margin:4px 0;font-weight:800;letter-spacing:3px;color:var(--pink)}
h2{text-align:center;margin:8px 0}
.logo{text-align:center;font-size:30px;letter-spacing:10px;color:var(--teal)}
.sub{text-align:center;color:var(--mut);margin:2px 0 14px}
.top{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{background:var(--pn);border:2px solid var(--pink);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-weight:800;cursor:pointer}
.panel{background:var(--pn);border:2px solid #34344a;border-radius:16px;padding:16px;margin-top:10px}
.c{text-align:center}
.lab{font-weight:800;margin-bottom:8px}
.seg{display:flex;gap:8px}
.sg{flex:1;font:inherit;font-weight:800;padding:10px;border:2px solid #4a4a66;background:#252536;color:var(--ink);border-radius:10px;cursor:pointer}
.sg.on{background:var(--pink);border-color:var(--pink)}
.menu{display:grid;gap:10px;margin-top:12px}
.mb{display:flex;gap:14px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--pn);border:2px solid #34344a;border-left:6px solid var(--pink);border-radius:14px;padding:14px;cursor:pointer}
.mb:hover{border-color:var(--pink)}.mb i{font-style:normal;font-size:38px}.mb b{display:block;font-size:19px}.mb small{color:var(--mut);font-size:14px}.mb.sm{justify-content:center;border-left-color:var(--teal);font-weight:800}
.go{display:block;width:100%;margin-top:14px;font:inherit;font-size:20px;font-weight:800;padding:13px;border:0;border-radius:12px;background:var(--pink);color:#fff;cursor:pointer}
.tb{display:flex;align-items:center;gap:10px}.tbar{flex:1;height:14px;background:#2b2b40;border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;width:100%;background:#2ecc71;transition:width .1s linear}.tbar i.r{background:#ff3b5c}
.hpb{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.hh{font-size:24px;letter-spacing:3px;line-height:1}.lv{display:flex;gap:6px}.pl{background:#1d8f7e;border:2px solid #fff;border-radius:8px;padding:3px 8px;font-size:14px;font-weight:800}.pl.dead{background:#333;color:#777;border-color:#555;text-decoration:line-through}
.run{position:relative;height:36px;margin:10px 0;border-bottom:3px dashed #4a4a66}.run span{position:absolute;bottom:0;font-size:28px;transition:left .5s}.run b{position:absolute;right:0;bottom:0;font-size:28px}
.tag{display:inline-block;background:#2b2b40;color:var(--mut);border-radius:8px;padding:3px 12px;margin-top:10px}
.big{font-size:clamp(44px,13vw,76px);font-weight:800;line-height:1.1;margin:4px 0}.big.sm{font-size:clamp(36px,10vw,56px)}
.ask{font-size:22px;color:var(--pink);font-weight:800;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.one{grid-template-columns:1fr}
.opt{font:inherit;font-size:clamp(18px,5vw,24px);font-weight:800;padding:16px 8px;border:2px solid #4a4a66;border-radius:12px;background:#262638;color:var(--ink);cursor:pointer}
.opt:active{transform:scale(.97)}.opt:disabled{cursor:default;opacity:.8}
.opt.good{background:#1f9d57!important;border-color:#2ecc71}.opt.bad{background:#b3243f!important;animation:sh .4s}
.pane{background:linear-gradient(135deg,rgba(120,220,255,.28),rgba(120,220,255,.1));border-color:#7fd8ff;padding:34px 8px}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.steps{display:flex;gap:6px;justify-content:center}.steps span{width:26px;height:12px;border-radius:4px;background:#34344a}.steps .dn{background:#7fd8ff}.steps .cur{background:var(--pink)}
.cookie{width:110px;height:110px;margin:4px auto;border-radius:50%;background:#d9a05b;border:5px solid #b97d3a;font-size:56px;line-height:100px;transition:transform .3s}.cookie.crack{transform:rotate(-8deg) scale(.95);filter:contrast(.8)}
.inp{display:flex;gap:10px;margin-top:10px}.inp label{flex:1;color:var(--mut);text-align:left}
input{width:100%;font:inherit;font-size:22px;font-weight:800;padding:10px;border-radius:10px;border:2px solid #4a4a66;background:#12121c;color:var(--ink);margin-top:4px}
input.ok{border-color:#2ecc71;background:#15301f}input.no{border-color:#ff3b5c;background:#341620}
.msg{min-height:30px;font-size:20px;font-weight:800;margin-top:10px}
.bigem{font-size:80px}
.rope{display:flex;align-items:center;gap:6px;font-size:28px}.trk{flex:1;display:grid;grid-template-columns:repeat(11,1fr);height:44px}.trk i{font-style:normal;display:flex;align-items:center;justify-content:center;font-size:24px;border-top:3px solid #4a4a66;border-bottom:3px solid #4a4a66}.trk i.mid{background:rgba(237,27,118,.25)}
.turn{display:inline-block;color:#fff;font-weight:800;padding:4px 14px;border-radius:8px;margin-top:10px}
.srch{margin:6px 0 10px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid #34344a;text-align:left}th{color:var(--pink)}td:last-child{color:var(--mut)}
.conf{position:fixed;top:-30px;font-size:28px;animation:fall 2.8s linear forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D=`be,was/were,been,бути;become,became,become,ставати;begin,began,begun,починати;bite,bit,bitten,кусати;break,broke,broken,ламати;bring,brought,brought,приносити;build,built,built,будувати;buy,bought,bought,купувати;catch,caught,caught,ловити;choose,chose,chosen,обирати;come,came,come,приходити;cost,cost,cost,коштувати;cut,cut,cut,різати;do,did,done,робити;draw,drew,drawn,малювати;drink,drank,drunk,пити;drive,drove,driven,водити;eat,ate,eaten,їсти;fall,fell,fallen,падати;feed,fed,fed,годувати;feel,felt,felt,відчувати;fight,fought,fought,битися;find,found,found,знаходити;fly,flew,flown,літати;forget,forgot,forgotten,забувати;get,got,got,отримувати;give,gave,given,давати;go,went,gone,іти;grow,grew,grown,рости;have,had,had,мати;hear,heard,heard,чути;hit,hit,hit,бити;hold,held,held,тримати;hurt,hurt,hurt,боліти;keep,kept,kept,зберігати;know,knew,known,знати;learn,learnt/learned,learnt/learned,вчити;leave,left,left,залишати;lend,lent,lent,позичати;let,let,let,дозволяти;lose,lost,lost,губити;make,made,made,створювати;meet,met,met,зустрічати;pay,paid,paid,платити;put,put,put,класти;read,read,read,читати;run,ran,run,бігати;say,said,said,казати;see,saw,seen,бачити;sell,sold,sold,продавати;send,sent,sent,відправляти;show,showed,shown,показувати;sing,sang,sung,співати;sit,sat,sat,сидіти;sleep,slept,slept,спати;smell,smelt/smelled,smelt/smelled,пахнути;speak,spoke,spoken,говорити;spend,spent,spent,витрачати;stand,stood,stood,стояти;swim,swam,swum,плавати;take,took,taken,брати;teach,taught,taught,навчати;tell,told,told,розповідати;think,thought,thought,думати;throw,threw,thrown,кидати;understand,understood,understood,розуміти;wake,woke,woken,прокидатися;wear,wore,worn,носити;win,won,won,вигравати;write,wrote,written,писати`.split(';').map(x=>x.split(','));
const $=s=>document.querySelector(s),app=$('#app'),sh=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.random()*a.length|0];
let cfg={pool:0},tm;try{const s=JSON.parse(localStorage.getItem('vg'));if(s)cfg=s}catch(e){}
if(cfg.len===undefined)cfg.len=35;
const P=()=>cfg.pool==1?D.slice(0,35):cfg.pool==2?D.slice(35):D;
function setLen(v){cfg.len=v;try{localStorage.setItem('vg',JSON.stringify(cfg))}catch(e){}home()}
function setPool(v){cfg.pool=v;try{localStorage.setItem('vg',JSON.stringify(cfg))}catch(e){}home()}
const NUM=['456','067','199'],hp=l=>'❤️'.repeat(l)+'🖤'.repeat(3-l),lv=l=>`<div class="hpb"><div class="hh">${hp(l)}</div><div class="lv">${NUM.map((n,i)=>`<span class="pl ${i<l?'':'dead'}">${n}</span>`).join('')}</div></div>`;
const hdr=r=>`<div class="top"><button class="pill" onclick="home()">☰ Меню</button>${r||''}</div>`;
const bar=()=>`<div class="tb"><span id="lt">🟢</span><div class="tbar"><i id="tb"></i></div></div>`;
const reg=x=>/e$/.test(x)?x+'d':x+'ed',F=x=>x.split('/')[0];
function confetti(){for(let i=0;i<30;i++){const s=document.createElement('span');s.className='conf';s.textContent=['⭕','🔺','⬜','🟢'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.9+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3800)}}
function timer(sec,end){clearInterval(tm);let L=sec*10;tm=setInterval(()=>{L--;const b=$('#tb');if(!b){clearInterval(tm);return}b.style.width=L/(sec*10)*100+'%';const red=L<sec*3;b.className=red?'r':'';$('#lt').textContent=red?'🔴':'🟢';if(L<=0){clearInterval(tm);end()}},100)}
function bind(ok,cb){const bs=[...document.querySelectorAll('.opt')];let d=0;const res=b=>{if(d)return;d=1;clearInterval(tm);const g=!!b&&ok(b.textContent);bs.forEach(x=>{x.disabled=true;if(ok(x.textContent))x.classList.add('good')});if(b&&!g)b.classList.add('bad');setTimeout(()=>cb(g),g?650:1500)};bs.forEach(b=>b.onclick=()=>res(b));return()=>res(null)}
function fin(w,t,s,again){clearInterval(tm);if(w)confetti();app.innerHTML=`${hdr()}<div class="panel c"><div class="bigem">${w?'🏆':'❌'}</div><h2>${t}</h2><p class="sub">${s}</p><button class="go" onclick="${again}">🔁 Ще раз</button></div>`}
function opts(v,k,n=4){const c=v[k],pool=new Set();[v[0],v[1],v[2],reg(v[0])].forEach(x=>{if(x!==c)pool.add(x)});const oth=sh(P()).map(u=>u[k]);let i=0;while(pool.size<n-1&&i<oth.length){if(oth[i]!==c)pool.add(oth[i]);i++}return sh([c,...sh([...pool]).slice(0,n-1)])}

function home(){clearInterval(tm);app.innerHTML=`<div class="logo">○ △ □</div><h1>VERB GAMES</h1><div class="sub">Неправильні дієслова: V1 · V2 · V3 та Present Perfect</div>
<div class="panel"><div class="lab">Які дієслова тренуємо?</div><div class="seg">${[['Всі 70',0],['1–35',1],['36–70',2]].map(([l,v])=>`<button class="sg ${cfg.pool==v?'on':''}" onclick="setPool(${v})">${l}</button>`).join('')}</div><div class="lab" style="margin-top:14px">Скільки слів у грі Red Light?</div><div class="seg">${[['20',20],['35',35],['Всі в наборі',0]].map(([l,v])=>`<button class="sg ${cfg.len==v?'on':''}" onclick="setLen(${v})">${l}</button>`).join('')}</div></div>
<div class="menu">
<button class="mb" onclick="rl()"><i>🟢</i><span><b>Red Light, Green Light</b><small>V3 на швидкість · кожне слово один раз · +1 ❤️ за 10 правильних поспіль</small></span></button>
<button class="mb" onclick="bridge()"><i>🌉</i><span><b>Glass Bridge</b><small>Обери справжнє скло: V2 і V3</small></span></button>
<button class="mb" onclick="dal()"><i>🍪</i><span><b>Dalgona</b><small>Впиши V2 і V3 і не зламай печиво</small></span></button>
<button class="mb" onclick="tug(1)"><i>🪢</i><span><b>Tug of War · клас</b><small>Present Perfect: команда проти команди</small></span></button>
<button class="mb" onclick="tug(0)"><i>🔺</i><span><b>Tug of War · соло</b><small>Present Perfect проти охоронця</small></span></button>
<button class="mb sm" onclick="sheet()">📋 Список усіх дієслів</button></div>`}

function sheet(){app.innerHTML=`${hdr()}<h2>📋 Дієслова</h2><input class="srch" id="q" placeholder="Пошук…" oninput="fl()"><div class="tw"><table><thead><tr><th>#</th><th>V1</th><th>V2</th><th>V3</th><th>UA</th></tr></thead><tbody id="tb2"></tbody></table></div>`;fl()}
function fl(){const q=$('#q').value.toLowerCase();$('#tb2').innerHTML=D.map((v,i)=>[i+1,...v]).filter(r=>r.join(' ').toLowerCase().includes(q)).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}

function rl(){let L=3,ok=0,i=0,st=0;const Q=sh(P()).slice(0,cfg.len||P().length),G=Q.length;
function q(){const v=Q[i],j=Math.random()<.35&&v[1]!==v[2]?1:0,o=opts(v,2);
app.innerHTML=`${hdr(lv(L))}<div class="panel c">${bar()}<div class="run"><span style="left:${i/G*90}%">🏃</span><b>🏁</b></div><div class="tag">${i+1}/${G} · V${j+1} · ${v[3]}</div><div class="big">${v[j]}</div><div class="ask">V3 = ?</div><div class="opts">${o.map(x=>`<button class="opt">${x}</button>`).join('')}</div></div>`;
const to=bind(t=>t===v[2],g=>{i++;if(g){ok++;st++;if(st%10==0&&L<3)L++}else{L--;st=0}if(L<=0)return fin(0,'Тебе вибито','Пройдено '+i+' з '+G+' слів','rl()');if(i>=G)return fin(1,'Ти пройшов(-ла) усі слова!','Правильно: '+ok+' з '+G,'rl()');q()});timer(8,to)}q()}

function bridge(){let L=3,s=0,lw;const N=8;
function q(){const v=pick(P().filter(x=>x!==lw));lw=v;const[j,k]=pick([[0,1],[0,2],[1,2]]),c=v[k],d=opts(v,k,2).find(x=>x!==c)||v[0];
app.innerHTML=`${hdr(lv(L))}<div class="panel c"><div class="steps">${Array.from({length:N},(_,i)=>`<span class="${i<s?'dn':i==s?'cur':''}"></span>`).join('')}</div><div class="tag">${v[3]}</div><div class="big sm">V${j+1}: ${v[j]}</div><div class="ask">→ V${k+1}?</div><div class="opts">${sh([c,d]).map(x=>`<button class="opt pane">${x}</button>`).join('')}</div></div>`;
bind(t=>t===c,g=>{g?s++:L--;if(s>=N)return fin(1,'Ти перейшов(-ла) міст!','Життів втрачено: '+(3-L),'bridge()');if(L<=0)return fin(0,'Скло розбилось','Пройдено кроків: '+s+' з '+N,'bridge()');q()})}q()}

function dal(){let c=0,r=0,lw;const N=8,SH=['⭕','🔺','⬜','⭐'],cr=()=>hp(3-c);
function q(){if(r>=N)return fin(1,'Печиво ціле!','Ти вирізав(-ла) усі '+N+' форм','dal()');const v=pick(P().filter(x=>x!==lw));lw=v;
app.innerHTML=`${hdr(`<span class="pill" id="cr">${cr()}</span>`)}<div class="panel c"><div class="cookie">${SH[r%4]}</div><div class="tag">${r+1}/${N} · ${v[3]}</div><div class="big sm">${v[0]}</div><div class="inp"><label>V2<input id="i2" autocomplete="off" autocapitalize="none" spellcheck="false"></label><label>V3<input id="i3" autocomplete="off" autocapitalize="none" spellcheck="false"></label></div><button class="go" id="ck">✂️ Вирізати</button><div class="msg" id="m"></div></div>`;
const A=[$('#i2'),$('#i3')];A[0].focus();
const chk=()=>{const o=A.map((e,i)=>v[i+1].split('/').includes(e.value.trim().toLowerCase()));A.forEach((e,i)=>{e.className=o[i]?'ok':'no';if(o[i])e.readOnly=true});
if(o[0]&&o[1]){r++;$('#m').textContent='✅ Чисто!';setTimeout(q,800)}
else{c++;$('#cr').textContent=cr();$('#m').textContent='💥 Тріщина! Червоне — помилка';$('.cookie').classList.add('crack');if(c>=3)fin(0,'Печиво зламалось','Було: '+v[0]+' – '+v[1]+' – '+v[2],'dal()')}};
$('#ck').onclick=chk;A.forEach(e=>e.onkeydown=ev=>{if(ev.key=='Enter'){ev.preventDefault();if(e===A[0]&&!A[1].readOnly&&!A[1].value)A[1].focus();else chk()}})}q()}

const SB=[['I',1],['You',1],['We',1],['They',1],['My parents',1],['He',0],['She',0],['My brother',0],['Our team',0]],BAD=['cost','let','put','hit','lend','feed','hold','bite'];
function pp(){const v=pick(P().filter(x=>!BAD.includes(x[0]))),[S,pl]=pick(SB),kind=pick('pnq'),a=pl?'have':'has',w=pl?'has':'have',v1=v[0],v2=F(v[1]),v3=F(v[2]),m=pick(['already','before','today','this week','many times']),sl=S=='I'?S:S.toLowerCase(),cp=x=>x[0].toUpperCase()+x.slice(1);let c,d;
if(kind=='p'){c=`${S} ${a} ${v3} ${m}.`;d=[`${S} ${a} ${v2} ${m}.`,`${S} ${w} ${v3} ${m}.`,`${S} ${a} ${v1} ${m}.`,`${S} ${v2} ${m}.`,`${S} ${a} ${reg(v1)} ${m}.`]}
else if(kind=='n'){c=`${S} ${a}n’t ${v3} yet.`;d=[`${S} ${a}n’t ${v2} yet.`,`${S} ${w}n’t ${v3} yet.`,`${S} ${a}n’t ${v1} yet.`,`${S} didn’t ${v3} yet.`,`${S} ${a}n’t ${reg(v1)} yet.`]}
else{c=`${cp(a)} ${sl} ever ${v3}?`;d=[`Did ${sl} ever ${v3}?`,`${cp(w)} ${sl} ever ${v3}?`,`${cp(a)} ${sl} ever ${v2}?`,`${cp(a)} ${sl} ever ${v1}?`,`${cp(a)} ${sl} ever ${reg(v1)}?`]}
return{c,o:sh([c,...sh([...new Set(d.filter(x=>x!==c))]).slice(0,3)])}}

function tug(team){let p=0,turn=0;const T=team?[['⭕','Команда ⭕','#ed1b76'],['🔺','Команда 🔺','#0f9d8f']]:[['⭕','Ти','#ed1b76'],['🔺','Охоронець','#0f9d8f']];
function q(){const x=pp(),t=T[turn];
app.innerHTML=`${hdr()}<div class="panel c"><div class="rope"><b>${T[0][0]}</b><div class="trk">${Array.from({length:11},(_,i)=>`<i class="${i==5?'mid':''}">${i-5==p?'🪢':''}</i>`).join('')}</div><b>${T[1][0]}</b></div>${team?`<div class="turn" style="background:${t[2]}">Відповідає: ${t[1]}</div>`:''}${bar()}<div class="tag">Present Perfect · have/has + V3</div><div class="opts one" style="margin-top:12px">${x.o.map(o=>`<button class="opt">${o}</button>`).join('')}</div></div>`;
const to=bind(t=>t===x.c,g=>{if(team){p+=g?(turn?1:-1):(turn?-1:1);turn^=1}else{p+=g?-1:1;if(Math.random()<.3)p++}
if(p<=-5)return fin(1,team?'Перемагає '+T[0][1]+'!':'Ти переміг(-ла) охоронця!','Канат перетягнуто','tug('+team+')');
if(p>=5)return fin(team?1:0,team?'Перемагає '+T[1][1]+'!':'Охоронець переміг','Канат перетягнуто','tug('+team+')');q()});timer(team?20:15,to)}q()}
home();
</script>
</body>
</html>
